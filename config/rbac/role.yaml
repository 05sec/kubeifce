---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - interface.kubeifce.lwsec.cn
  resources:
  - bridges
  - vlans
  - vxlans
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - interface.kubeifce.lwsec.cn
  resources:
  - bridges/finalizers
  - vlans/finalizers
  - vxlans/finalizers
  verbs:
  - update
- apiGroups:
  - interface.kubeifce.lwsec.cn
  resources:
  - bridges/status
  - vlans/status
  - vxlans/status
  verbs:
  - get
  - patch
  - update
