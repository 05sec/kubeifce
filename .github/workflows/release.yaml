    release:
        name: semantic-release
        runs-on: ubuntu-22.04
        needs: [test, lint]
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        outputs:
            new-release-published: ${{ steps.semantic.outputs.new_release_published }}
            new-release-version: ${{ steps.semantic.outputs.new_release_version }}
        steps:
            - name: Source checkout
              uses: actions/checkout@v4
            - name: Semantic Release
              id: semantic
              uses: cycjimmy/semantic-release-action@v3
              with:
                  semantic_version: 19.0.5

    image-releaser:
        name: binary-release
        runs-on: ubuntu-latest
        needs: release
        if: needs.release.outputs.new-release-published == 'true'
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - run: git fetch --force --tags
            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v4
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=pep440,pattern={{version}},value=${{ needs.release.outputs.new-release-version }}
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
            # 更新安装配置文件
            - name: Update installer configuration
              run: |
                echo "Updating installer with image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
                make build-installer IMG=${{ fromJSON(steps.meta.outputs.json).tags[0] }}
                
                # 检查是否有文件变更
                if [[ -n $(git status --porcelain) ]]; then
                  echo "Files were modified, committing changes..."
                  git add .
                  git status
                else
                  echo "No files were modified, skipping commit..."
                  exit 0
                fi

            # 提交并推送变更
            - name: Commit and push installer updates
              run: |
                # 只有在上一步检测到文件变更时才执行
                if [[ -n $(git status --staged --porcelain) ]]; then
                  git commit -m "chore: update installer configuration to version ${{ needs.release.outputs.new-release-version }}
                
                  - Updated image references to ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
                  - Auto-generated by release workflow
                
                  [skip ci]"
                
                  echo "Pushing changes to repository..."
                  git push origin HEAD:${{ github.ref_name }}
                else
                  echo "No staged changes found, skipping push..."
                fi
